# ثبّت إصدارات الـ actions بعد المراجعة (SHA)، وDependabot يحدّثها.
name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        shell: pwsh
        run: |
          $restoreOutput = & dotnet restore YApex.sln --verbosity minimal 2>&1
          $restoreExitCode = $LASTEXITCODE
          $restoreOutput | ForEach-Object { Write-Output $_ }
          if ($restoreExitCode -ne 0) {
            $diagnostics = $restoreOutput | Where-Object { "$_" -match '(?i)(error|warning|failed|unable|NU[0-9]{4})' } | Select-Object -Last 20
            foreach ($diagnostic in $diagnostics) {
              $message = "$diagnostic" -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A'
              Write-Output "::error::$message"
            }
            throw "dotnet restore failed with exit code $restoreExitCode."
          }
      - name: Build
        run: dotnet build YApex.sln -c Release --no-restore
      - name: Test
        run: dotnet test YApex.sln -c Release --no-build --logger "trx;LogFileName=tests.trx"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore
      - name: Build portable Windows package
        shell: pwsh
        run: ./tools/build-portable.ps1 -Runtime win-x64
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build installer and checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installerOutput = Join-Path $env:GITHUB_WORKSPACE 'out/installer'
          New-Item -ItemType Directory -Path $installerOutput -Force | Out-Null
          $compiler = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          $compilerPath = if ($null -ne $compiler) { $compiler.Path } else { $null }
          $programFilesDirectories = @(
            [Environment]::GetEnvironmentVariable('ProgramFiles(x86)')
            [Environment]::GetEnvironmentVariable('ProgramFiles')
          ) | Where-Object { -not [string]::IsNullOrWhiteSpace($_) } | Select-Object -Unique
          if ([string]::IsNullOrWhiteSpace($compilerPath)) {
            foreach ($directory in $programFilesDirectories) {
              $installations = Get-ChildItem -LiteralPath $directory -Directory -Filter 'Inno Setup*' -ErrorAction SilentlyContinue |
                Sort-Object Name -Descending
              foreach ($installation in $installations) {
                $candidate = Join-Path $installation.FullName 'ISCC.exe'
                if (Test-Path -LiteralPath $candidate -PathType Leaf) {
                  $compilerPath = $candidate
                  break
                }
              }
              if (-not [string]::IsNullOrWhiteSpace($compilerPath)) { break }
            }
          }
          if ([string]::IsNullOrWhiteSpace($compilerPath)) {
            throw "Inno Setup compiler ISCC.exe was not found. Program Files roots checked: $($programFilesDirectories -join '; ')."
          }
          $installerScript = Join-Path $env:GITHUB_WORKSPACE 'installer/Y-Apex.iss'
          if (-not (Test-Path -LiteralPath $installerScript -PathType Leaf)) {
            throw "Installer script was not found: $installerScript"
          }
          foreach ($directory in @('ui', 'service', 'cli')) {
            $payloadDirectory = Join-Path $env:GITHUB_WORKSPACE "out/portable/win-x64/$directory"
            if (-not (Test-Path -LiteralPath $payloadDirectory -PathType Container)) {
              throw "Portable package directory was not found: $payloadDirectory"
            }
          }
          Write-Output "Using Inno Setup compiler: $compilerPath"
          Write-Output "Compiling installer script: $installerScript"
          & $compilerPath $installerScript
          $compilerExitCode = $LASTEXITCODE
          if ($compilerExitCode -ne 0) {
            throw "Inno Setup failed with exit code $compilerExitCode."
          }
          ./tools/generate-sha256sums.ps1 -Target $installerOutput
      - name: Upload Windows test package
        uses: actions/upload-artifact@v7
        with:
          name: Y-Apex-Windows-x64
          path: |
            out/portable/win-x64
            out/installer
          if-no-files-found: error
          retention-days: 30
      - name: Check vulnerable dependencies
        run: dotnet list YApex.sln package --vulnerable --include-transitive
      - name: Generate SBOM
        shell: pwsh
        run: |
          dotnet tool install --global CycloneDX
          dotnet-CycloneDX YApex.sln -o sbom
      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom
  codeql:
    runs-on: windows-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: csharp
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Restore for CodeQL
        run: dotnet restore YApex.sln --verbosity minimal
      - name: Build for CodeQL
        run: dotnet build YApex.sln -c Release --no-restore
      - uses: github/codeql-action/analyze@v4
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
